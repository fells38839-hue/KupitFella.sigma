<style>

.rip{position:absolute;border-radius:50%;background:#ffffff66;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 20% 30%,#2f5bff33,transparent 40%),radial-gradient(circle at 80% 20%,#ffd23f44,transparent 35%),radial-gradient(circle at 60% 80%,#ff5d8f2e,transparent 40%);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,3%) rotate(6deg) scale(1.08)}}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
h1{animation:rise .8s cubic-bezier(.2,.8,.2,1) backwards}

.item{animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards;transition:transform .25s,box-shadow .25s}
.item:nth-child(1){animation-delay:.25s}.item:nth-child(2){animation-delay:.35s}.item:nth-child(3){animation-delay:.45s}.item:nth-child(4){animation-delay:.55s}
.item:hover{transform:translateY(-6px) rotate(-.6deg);box-shadow:0 16px 32px #0002}
h1 span{display:inline-block;cursor:pointer;background-image:linear-gradient(100deg,transparent 40%,#ffffffaa 50%,transparent 60%);background-size:250% 100%;background-repeat:no-repeat;animation:sheen 3.6s ease-in-out infinite}
@keyframes sheen{from{background-position:150% 0}to{background-position:-50% 0}}

@keyframes wig{20%{transform:rotate(-6deg) scale(1.08)}50%{transform:rotate(5deg) scale(1.1)}80%{transform:rotate(-2deg)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:100}
.fly{position:fixed;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--sun);box-shadow:0 0 18px var(--sun);z-index:60;pointer-events:none;transition:transform .65s cubic-bezier(.5,-.3,.7,1),opacity .65s}
.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.18) rotate(-3deg)}}
.bye{animation:bye .25s forwards}
@keyframes bye{to{opacity:0;transform:translateX(60px)}}
#msg.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<div class="wrap">
  <header>
    <div class="logo">Фелл.shop</div>
    <button id="open">Корзина (<span id="count">0</span>)</button>
  </header>

  <section class="hero">
    <h1>Купи<br><span>Фелла</span></h1>
    <p>Единственный магазин, где можно получить Фелла в нескольких комплектациях. Доставка по любому каналу связи.</p>

</div>

<aside id="cart" aria-label="Корзина">
  <h3>Корзина</h3>
  <div id="tools"><label><input type="checkbox" id="all" checked> Выбрать все</label><button class="ghost" id="clear">Убрать всё</button></div>
  <div id="lines"></div>
  <div class="row"><span>Итого</span><span class="price" id="total">0 ₴</span></div>
  <div id="msg"></div>
  <button class="add" id="buy">Оформить заказ</button>
  <button id="close">Закрыть</button>
</aside>

<script>
const items=[
 {id:1,name:"Фелл классический",desc:"Стандартная комплектация: отвечает на сообщения, шутит, иногда спит.",price:100},
 {id:2,name:"Фелл на вечер",desc:"Поговорить о жизни, обсудить фильм или просто помолчать вместе.",price:250},
 {id:3,name:"Подписка «Фелл каждый день»",desc:"Ежедневный привет и один мем. Отмена в любой момент.",price:400},
 {id:4,name:"Фелл коллекционный",desc:"Ограниченный тираж из одного экземпляра. Повторно не производится.",price:999}
];
const cart={},off={};
const $=id=>document.getElementById(id);
$("grid").innerHTML=items.map(i=>`<article class="item"><h2>${i.name}</h2><p>${i.desc}</p><div class="row"><span class="price">${i.price} ₴</span><button class="add" data-id="${i.id}">В корзину</button></div></article>`).join("");
function render(){
  const ids=Object.keys(cart);
  $("count").textContent=ids.reduce((s,k)=>s+cart[k],0);
  document.querySelectorAll("#grid [data-id]").forEach(b=>{const n=cart[b.dataset.id]||0;b.classList.toggle("on",n>0);b.firstChild.nodeValue=n?"В корзине ×"+n:"В корзину"});
  $("lines").innerHTML=ids.length?ids.map(k=>{const i=items.find(x=>x.id==k);return `<div class="line${off[k]?" off":""}"><input type="checkbox" data-chk="${k}" aria-label="Брать: ${i.name}" ${off[k]?"":"checked"}><span class="nm">${i.name} × ${cart[k]}</span><span class="sum">${i.price*cart[k]} ₴</span><button class="x" data-del="${k}" aria-label="Убрать ${i.name}">×</button></div>`}).join(""):"Корзина пуста. Добавьте Фелла.";
  $("all").checked=ids.length>0&&ids.every(k=>!off[k]);
  $("all").disabled=$("clear").disabled=!ids.length;
  tweenTotal(ids.reduce((s,k)=>off[k]?s:s+items.find(x=>x.id==k).price*cart[k],0));
}
$("grid").addEventListener("click",e=>{const b=e.target.closest("[data-id]");if(!b)return;cart[b.dataset.id]=(cart[b.dataset.id]||0)+1;$("msg").style.display="none";render();fly(b)});
$("open").onclick=()=>$("cart").classList.add("open");
$("lines").addEventListener("click",e=>{const d=e.target.closest("[data-del]");if(d){d.closest(".line").classList.add("bye");setTimeout(()=>{delete cart[d.dataset.del];delete off[d.dataset.del];$("msg").style.display="none";render()},250)}});
$("lines").addEventListener("change",e=>{const c=e.target.closest("[data-chk]");if(c){off[c.dataset.chk]=!c.checked;render()}});
$("all").onchange=e=>{Object.keys(cart).forEach(k=>off[k]=!e.target.checked);render()};
$("clear").onclick=()=>{document.querySelectorAll("#lines .line").forEach((r,i)=>{r.style.animationDelay=i*60+"ms";r.classList.add("bye")});setTimeout(()=>{Object.keys(cart).forEach(k=>{delete cart[k];delete off[k]});$("msg").style.display="none";render()},250+Object.keys(cart).length*60)};
$("close").onclick=()=>$("cart").classList.remove("open");
$("buy").onclick=()=>{const m=$("msg");m.style.display="block";const ids=Object.keys(cart);const sel=ids.filter(k=>!off[k]);m.textContent=!ids.length?"Сначала добавьте Фелла в корзину.":!sel.length?"Отметьте галочкой хотя бы один товар.":"Заказ принят. Фелл уже получил уведомление и скоро выйдет на связь.";m.classList.remove("pop");void m.offsetWidth;m.classList.add("pop");if(sel.length)burst(innerWidth/2,innerHeight*.65,140)};
const rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
const cv=document.createElement("canvas");cv.id="fx";document.body.appendChild(cv);
const cx=cv.getContext("2d");let P=[],raf=0;
const fit=()=>{cv.width=innerWidth;cv.height=innerHeight};fit();addEventListener("resize",fit);
function burst(x,y,n){if(rm)return;const C=["#2f5bff","#ffd23f","#ff5d8f","#22c58b","#ffffff"];for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=3+Math.random()*7;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,r:Math.random()*6,vr:(Math.random()-.5)*.4,w:5+Math.random()*6,h:3+Math.random()*4,c:C[i%C.length],l:1})}if(!raf)raf=requestAnimationFrame(tick)}
function tick(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l>0&&p.y<cv.height+20);for(const p of P){p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l-=.011;cx.save();cx.globalAlpha=Math.max(p.l,0);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()}raf=P.length?requestAnimationFrame(tick):0}
function bump(){const c=$("open");c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump")}
function fly(b){const a=b.getBoundingClientRect(),t=$("open").getBoundingClientRect(),x=a.left+a.width/2,y=a.top+a.height/2;if(rm)return bump();const d=document.createElement("div");d.className="fly";d.style.left=x+"px";d.style.top=y+"px";document.body.appendChild(d);burst(x,y,18);requestAnimationFrame(()=>requestAnimationFrame(()=>{d.style.transform=`translate(${t.left+t.width/2-x}px,${t.top+t.height/2-y}px) scale(.3)`;d.style.opacity=".6"}));setTimeout(()=>{d.remove();bump()},650)}
let shown=0,tw=0;
function tweenTotal(v){cancelAnimationFrame(tw);const from=shown,t0=performance.now();if(rm){shown=v;$("total").textContent=v+" ₴";return}const step=t=>{const k=Math.min(1,(t-t0)/400);shown=Math.round(from+(v-from)*(1-Math.pow(1-k,3)));$("total").textContent=shown+" ₴";if(k<1)tw=requestAnimationFrame(step)};tw=requestAnimationFrame(step)}
document.addEventListener("pointerdown",e=>{const b=e.target.closest("button");if(!b||rm)return;const r=b.getBoundingClientRect(),s=document.createElement("span"),m=Math.max(r.width,r.height)*2;s.className="rip";s.style.cssText=`width:${m}px;height:${m}px;left:${e.clientX-r.left-m/2}px;top:${e.clientY-r.top-m/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),600)});
document.querySelector("h1 span").addEventListener("click",e=>{const s=e.currentTarget;burst(e.clientX,e.clientY,60);s.classList.remove("wig");void s.offsetWidth;s.classList.add("wig")});
render();
</script>
</body>
